name: project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  smooth_page_indicator: ^2.0.1
  provider: ^6.1.5+1
  pinput: ^6.0.2
  http: ^1.6.0
  fluttertoast: ^9.1.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  timeline_tile: ^2.0.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  photo_view: ^0.15.0
  flutter_launcher_icons: ^0.14.4
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_native_splash:
  color: "#33A444"

  image: assets/splash_logo.png

  android: true

  android_12:
    color: "#33A444"
    image: assets/splash_logo.png